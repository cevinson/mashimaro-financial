<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0FA98F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mashimaro" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="color-scheme" content="light" />
<meta name="description" content="Mashimaro Financial - pencatatan keuangan pribadi & usaha dengan strategi alokasi anggaran." />
<title>Mashimaro Financial</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navigasi utama"></nav>
    <button class="fab" id="fab" data-action="fab" aria-label="Tambah transaksi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="backdrop" id="backdrop" data-action="close-sheet"></div>
    <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-modal="true"></section>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <div class="print-doc" id="print-doc" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
